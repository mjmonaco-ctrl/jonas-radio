<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JONAS 04 — Radio ricevente</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0d13;display:grid;place-items:center}main{width:min(100%,1200px);position:relative;line-height:0}img{display:block;width:100%;height:auto}canvas{position:absolute;left:14.4%;top:48.2%;width:26.0%;height:9.5%;pointer-events:none}button{position:absolute;left:47.5%;top:51.9%;width:5.0%;height:6.7%;border:0;background:transparent;border-radius:50%;cursor:pointer;outline-offset:5px;touch-action:manipulation}button:focus-visible{outline:3px solid #bdddff}button::after{content:"";position:absolute;inset:13%;border-radius:50%;box-shadow:0 0 0 transparent;transition:box-shadow .2s}button::after{animation:respiro 2.4s ease-in-out infinite}button[aria-pressed="true"]::after{box-shadow:0 0 16px 8px #ffb64b88;animation:respiroAttivo 1.3s ease-in-out infinite}@keyframes respiro{0%,100%{box-shadow:0 0 5px 2px #ffb64b22}50%{box-shadow:0 0 14px 6px #ffb64b77}}@keyframes respiroAttivo{0%,100%{box-shadow:0 0 9px 4px #ffb64b66}50%{box-shadow:0 0 22px 10px #ffb64baa}} .hint{position:absolute;left:0;bottom:0;width:100%;font:12px system-ui,sans-serif;color:#cbd6e6;text-align:center;line-height:1.4;padding:8px;background:#080a0e88;opacity:0;transition:opacity .3s}main:focus-within .hint,main:hover .hint{opacity:1}
</style></head><body><main><img alt="Ricevitore radio in un osservatorio astronomico" src="radio.jpg"><canvas id="segnale" aria-hidden="true"></canvas><button id="pulsante" type="button" aria-label="Avvia la trasmissione di Jonas" aria-pressed="false" title="Avvia o interrompi la trasmissione"></button><div class="hint" id="stato" role="status">Premi il pulsante luminoso per ascoltare Jonas</div><audio id="voce" preload="metadata" src="jonas.mp3"></audio></main><script>
const audio=document.getElementById('voce'),btn=document.getElementById('pulsante'),canvas=document.getElementById('segnale'),ctx=canvas.getContext('2d'),stato=document.getElementById('stato');let valori=[],ultimo=0,attivo=false;
function misura(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d)}
function nuovoSegnale(){valori=Array.from({length:80},()=>{let y=(Math.random()-.5)*5;if(Math.random()<.1)y+=(Math.random()-.5)*22;return y})}
function disegna(t){if(attivo){if(t-ultimo>140){nuovoSegnale();ultimo=t}ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();const centro=canvas.height/2,passo=canvas.width/(valori.length-1),scala=canvas.height/110;valori.forEach((v,i)=>{let x=i*passo,y=centro+v*scala;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#BBDDFF';ctx.lineWidth=Math.max(1,canvas.height*.035);ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='#BBDDFF';ctx.shadowBlur=10;ctx.stroke()}else{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.moveTo(0,canvas.height/2);ctx.lineTo(canvas.width,canvas.height/2);ctx.strokeStyle='#BBDDFF';ctx.lineWidth=Math.max(1,canvas.height*.02);ctx.shadowColor='#BBDDFF';ctx.shadowBlur=5;ctx.stroke()}requestAnimationFrame(disegna)}
function aggiorna(){attivo=!audio.paused&&!audio.ended;btn.setAttribute('aria-pressed',String(attivo));btn.setAttribute('aria-label',attivo?'Metti in pausa la trasmissione':'Avvia la trasmissione di Jonas');stato.textContent=attivo?'Trasmissione in corso — premi per interrompere':'Premi il pulsante luminoso per ascoltare Jonas'}
btn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){stato.textContent='Impossibile avviare l’audio: '+e.message}}else audio.pause();aggiorna()});audio.addEventListener('play',aggiorna);audio.addEventListener('pause',aggiorna);audio.addEventListener('ended',()=>{audio.currentTime=0;aggiorna()});window.addEventListener('resize',misura);misura();nuovoSegnale();requestAnimationFrame(disegna);
</script></body></html>
